[project]
name = "quiniela-agentica"
version = "0.1.0"
description = "Un asistente experto en fútbol mexicano especializado en ayudar a llenar quinielas de la Liga MX."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "mlflow-tracing>=3.16.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "mlflow>=3.16.0",
    "ruff>=0.16.6",
    "tombi>=1.5.2",
]

[tool.ruff]
line-length = 120

[tool.tombi]
format.rules.indent-width = 4
